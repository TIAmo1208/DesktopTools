name: astrbot_plugin_desktop_status
display_name: Desktop 状态采集
author: plugin-dev
version: 0.2.0
description: 在 AstrBot 进程内采集服务/平台/资源/消息/日志/Token 用量，按契约 v2（service.probe 四档、原始快照经 loopback 通道推送）向本机 Desktop Tools 提供数据，并提供只监听 127.0.0.1 的反向接口供拉取与启停平台。
desc: AstrBot 侧状态采集插件（契约 v2）。service.probe 用 ok/warn/off/unknown 四档表达在线、探测被拒、离线与未知；采集失败的项一律给 null，不读取任何 AstrBot 凭据。
repo: https://localhost/desktop-tools/astrbot_plugin_desktop_status
category: 系统工具
tags:
  - 状态采集
  - 监控
  - Desktop Tools
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - webchat
astrbot_version: ">=4.22.0"
