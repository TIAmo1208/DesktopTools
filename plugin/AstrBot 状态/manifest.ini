[plugin]
id = plugin.astrbot-status
name = AstrBot 状态
version = 1.2.0
entry = index.js
author = Desktop Tools Project
description = 显示本机 AstrBot 的服务状态、就绪时长、平台连接、资源占用、消息量与运行日志。\n经宿主 loopback 通道读取本机快照，不读取 AstrBot 账号或凭据。
creatable = 1
removable = 1
maxTiles = 1
required_capabilities = loopback-channel

[tiles]
status = 状态
uptime = 就绪时长
platforms = 平台连接
resources = 资源占用
messages = 消息量
logs = 运行日志

[tiles.size]
status = 168x114, 168x70
uptime = 168x114, 168x70
platforms = 288x300, 200x100
resources = 220x210, 200x100
messages = 420x300, 380x150
logs = 420x300, 380x150
