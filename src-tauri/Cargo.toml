[package]
name = "desktop-tools"
version = "0.3.1"
description = "Windows desktop content workspace"
edition = "2024"
build = "build.rs"
default-run = "desktop-tools"

[lib]
name = "desktop_tools_lib"
# Windows 主程序和 guardian 仅消费 Rust 库，不生成 C ABI 库产物。
crate-type = ["lib"]

[[bin]]
name = "desktop-tools"
path = "src/main.rs"

[[bin]]
name = "desktop-tools-guardian"
path = "src/bin/guardian.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tauri 发布构建启用内嵌资源协议；开发构建继续使用 devUrl。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
jsonwebtoken = "9.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "gzip", "query"] }
zeroize = "1"
png = "0.17"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
webview2-com = "0.38"
windows = { version = "0.61.3", features = [
  "UI_ViewManagement",
  "Media_Control",
  "Win32_System_WinRT",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Credentials",
  "Win32_Storage_Xps",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_RemoteDesktop",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61.2"
wry = { version = "0.55.1", default-features = false, features = ["protocol"] }

[dev-dependencies]
windows = { version = "0.61.3", features = ["Win32_System_ProcessStatus"] }

# 保留函数与行号定位，减少开发产物；需要完整变量调试时临时覆盖为 2。
[profile.dev]
debug = 1

[profile.test]
debug = 1
