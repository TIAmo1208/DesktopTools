[package]
name = "desktop-tools"
version = "0.1.0"
description = "Windows desktop content workspace"
edition = "2024"
build = "build.rs"

[lib]
name = "desktop_tools_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "desktop-tools"
path = "src/main.rs"

[[bin]]
name = "desktop-tools-guardian"
path = "src/bin/guardian.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
webview2-com = "0.38"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_Xps",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
wry = { version = "0.55.1", default-features = false, features = ["protocol"] }

[dev-dependencies]
