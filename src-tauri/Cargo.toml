[package]
name = "desktop-tools"
version = "0.1.0"
description = "Windows desktop content workspace"
edition = "2024"
build = "build.rs"

[lib]
name = "desktop_tools_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "desktop-tools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
