<!doctype html>
<html lang="zh-CN">
    <meta charset="utf-8" />
    <title>浮岛内容层十态、边界与切换时序检查</title>
    <style>
        html,
        body {
            margin: 0;
            background: #d6c3bb;
        }
        #fixture {
            position: relative;
            padding: 24px;
            width: 900px;
            height: 520px;
            background: linear-gradient(120deg, #d8c3b8 0%, #e7d7cd 45%, #c9a89f 100%);
        }
        #result {
            position: fixed;
            left: 8px;
            bottom: 8px;
            margin: 0;
            padding: 8px;
            background: #000c;
            color: #7dff9b;
            font: 12px/1.5 monospace;
            white-space: pre-wrap;
        }
    </style>
    <body>
        <script>
            // 模块加载失败、未处理异常和隐藏页面也必须有界写出结论。
            const failAssertion = (reason) => {
                const result = document.getElementById("result");
                if (result && !/^(PASS|FAIL)/.test(result.textContent)) {
                    result.textContent = `FAIL\\n- ${reason}`;
                    document.body.dataset.phase = "fail";
                }
            };
            window.addEventListener("error", (event) => failAssertion(event.message || "断言模块加载失败"), true);
            window.addEventListener("unhandledrejection", (event) => failAssertion(String(event.reason)));
            setTimeout(() => failAssertion("断言总时限 60000ms：页面状态或动画未收敛"), 60000);
        </script>
        <main id="fixture"></main>
        <pre id="result">RUNNING</pre>
        <script type="module">
            // 证据层：L1 浏览器断言（真实 React 组件 + 真实 CSS）。原生投放 OLE 进入/离开顺序、WebView2
            // 真实合成的材质与观感仍由 L3 真机覆盖；本页只判定 DOM、dataset 与计算样式。
            import { 创建夹具, 消息, 媒体, 时间轴, 逐句歌词, 等待, 直到 } from "./islandFixture.js";

            // 夹具必须先于产品模块的副作用安装，否则桥与订阅会拿到未替换的运行时。
            const 夹具 = 创建夹具();

            // 断言页没有真原生窗口：用夹具提交的视口尺寸模拟 WebView 的 inner 尺寸（滞后两帧生效），
            // 让「视口条件等待」像真机一样先等到尺寸切换再解除遮蔽；真机换视口滞后的超时分支由单测覆盖。
            {
                let 模拟 = { width: 0, height: 0 };
                const 原始push = 夹具.提交.push.bind(夹具.提交);
                夹具.提交.push = (值) => {
                    const 结果 = 原始push(值);
                    if (值?.viewport) {
                        const 目标 = 值.viewport;
                        setTimeout(() => {
                            模拟 = { width: Math.round(目标.width), height: Math.round(目标.height) };
                        }, 80); // 模拟更明显的 WebView 换视口滞后（约 5 帧），让「等一帧」与「等视口条件」能被区分。
                    }
                    return 结果;
                };
                Object.defineProperty(window, "innerWidth", { configurable: true, get: () => 模拟.width || 420 });
                Object.defineProperty(window, "innerHeight", { configurable: true, get: () => 模拟.height || 1040 });
                window.__ISLAND_INNER_SIM__ = () => 模拟;
            }
            // 本页只验证内容层：清空岛快照里的常驻实例，避免真实音乐/天气卡抢占锚点可见位与前台排序。
            // 快照形状仍是生产读取路径（get_island_snapshot）给出的同一份数据。
            const 原生 = window.__DESKTOP_TOOLS_NATIVE__;
            const 原invoke = 原生.invoke.bind(原生);
            let 功能图标场景 = false;
            let 插件锚点场景 = false;
            let 收集列表 = [];

            let 天气预报;
            let 已读取天气 = false;
            const 城市 = { id: "fixture-city", name: "测试城市", tz: "Asia/Shanghai" };
            let 清空实例 = true; // 内容层场景用空快照；音乐档位场景再切回夹具自带的真实音乐实例。
            原生.invoke = (命令, 载荷) => {
                if (命令 === "get_plugin_settings") return Promise.resolve(null);
                if (功能图标场景 && 命令 === "get_collect_items") return Promise.resolve(收集列表);
                if (功能图标场景 && 命令 === "list_weather_sources") return Promise.resolve([{ source: "qweather", cities: [城市] }]);
                if (功能图标场景 && 命令 === "subscribe_weather") return Promise.resolve(1);
                if (功能图标场景 && 命令 === "get_weather_forecast") { 已读取天气 = true; return Promise.resolve(天气预报); }
                if (命令 !== "get_island_snapshot") return 原invoke(命令, 载荷);
                return 原invoke(命令, 载荷).then((快照) => {
                    const instances = 清空实例 ? [] : [...快照.instances];
                    if (!功能图标场景 && !插件锚点场景) return { ...快照, instances };
                    const manifests = [...快照.runtime.manifests];
                    const registrations = [...快照.runtime.instances];
                    const 新卡片 = 功能图标场景 ? [["official.collect-box", "收集箱"], ["official.weather", "天气"]] : [];
                    if (插件锚点场景) 新卡片.push(["plugin.anchor-fixture", "插件锚点夹具"]);
                    for (const [id, name] of 新卡片) {
                        const identity = { instanceId: `island.${id}`, componentId: id };
                        manifests.push({ ...manifests[0], id, name });
                        registrations.push({ ...registrations[0], ...identity });
                        instances.push({ ...快照.instances[0], ...identity });
                    }
                    return { ...快照, runtime: { ...快照.runtime, manifests, instances: registrations }, instances };
                });
            };

            const [岛模块, 内容模块, React模块, 根模块, 偏好模块, 样式模块] = await Promise.all([
                import("./island.tsx"),
                import("./islandContent.ts"),
                import("react"),
                import("react-dom/client"),
                import("../../app/preferences/PreferencesProvider.tsx"),
                import("../../styles/global.css"),
            ]);
            void 样式模块; // 只要求样式表加载完成，不读导出。
            const { IslandPage } = 岛模块;
            const { ISLAND_STATUS_SPECS, islandAnchorGlyph, islandAnchorValue } = 内容模块;
            const React = React模块.default;
            const { createRoot } = 根模块;
            const { PreferencesProvider } = 偏好模块;

            // 独立岛页面标记与主题，与窗口入口保持一致。
            document.documentElement.dataset.island = "true";
            document.documentElement.dataset.theme = "dark";
            document.documentElement.dataset.desktopTheme = "dark";
            const 容器 = document.getElementById("fixture");
            let 根 = createRoot(容器);
            const 渲染 = (属性 = {}) => 根.render(React.createElement(PreferencesProvider, null, React.createElement(IslandPage, 属性)));
            // 音乐实例场景结束后重建岛页：用空快照重新挂载，后续内容层时序不受常驻锚点影响。
            const 重新挂载 = () => {
                根.unmount();
                根 = createRoot(容器);
                渲染();
            };

            const 结果 = document.getElementById("result");
            const 失败 = [];
            // 系统开启减少动效时内容层直接落终态，动画与接力节奏断言在本环境无法成立，按环境跳过。
            const 减少动效 = matchMedia("(prefers-reduced-motion: reduce)").matches;
            const 跳过 = []; // 当前环境无法验证的动效项。
            // 失败先写出的结论不被迟到的成功覆盖。
            const report = (text) => {
                if (!结果.textContent.startsWith("FAIL")) 结果.textContent = text;
                document.body.dataset.phase = 结果.textContent.startsWith("FAIL") ? "fail" : "pass";
            };
            const 断言 = (条件, 说明) => {
                if (!条件) 失败.push(说明);
            };
            const 近似 = (实际, 期望, 容差 = 1) => Math.abs(实际 - 期望) <= 容差;

            const 岛 = () => document.querySelector("main.island");
            const 当前态 = () => 岛()?.dataset.state;
            const 卡片 = () => document.querySelector(".island-card--anchors") ?? document.querySelector(".island-card");
            const 胶囊行 = () => document.querySelector('.island-anchor-row[data-layout="capsule"]');
            const 悬停行 = () => document.querySelector('.island-anchor-row[data-layout="hover"]');
            const 锚点 = (身份) => document.querySelector(`.island-anchor[data-anchor="${CSS.escape(身份)}"]`);
            const 墨 = (身份) => 锚点(身份)?.querySelector(".island-anchor__ink");
            const 条目 = (身份) => 锚点(身份)?.closest(".island-anchor-item");
            const 文案 = (身份) => 条目(身份)?.querySelector(".island-anchor__text");
            const 标签 = (身份) => 条目(身份)?.querySelector(".island-anchor-label");
            const 胶囊锚点 = () => [...(胶囊行()?.querySelectorAll(".island-anchor") ?? [])];
            const 悬停按钮 = () => [...(悬停行()?.querySelectorAll("button.island-anchor") ?? [])];
            const 播报 = () => document.querySelector(".island__announcer")?.textContent ?? "";
            const 详情 = () => document.querySelector(".island-anchor-detail");
            const 详情文本 = () => [...(详情()?.querySelectorAll(".island-anchor__text") ?? [])].map((节点) => 节点.textContent).join(" / ");
            const 行 = () => document.querySelector(".island-music__line");
            const 按键 = (键) => 岛().dispatchEvent(new KeyboardEvent("keydown", { key: 键, bubbles: true }));
            const 悬停 = () => 岛().dispatchEvent(new PointerEvent("pointerover", { bubbles: true, pointerType: "mouse", relatedTarget: null }));

            // 等切态完成并恢复自然布局后再测量；动画期间根节点带内联尺寸。
            const 稳定 = async (期望) => {
                await 直到(() => 当前态() === 期望, `切到 ${期望}`, 5000);
                await 直到(() => !岛().style.inlineSize && !岛().style.blockSize, `${期望} 恢复自然布局`, 5000);
                await 等待(40);
            };

            // 合成 PointerEvent 没有 OS 活动指针；只替换 capture 平台方法，命中、拖动意图与展开判定仍走生产处理器。
            const 单击元素 = async (节点) => {
                const 框 = 节点.getBoundingClientRect();
                const 原set = 岛().setPointerCapture;
                const 原has = 岛().hasPointerCapture;
                const 原release = 岛().releasePointerCapture;
                岛().setPointerCapture = () => {};
                岛().hasPointerCapture = () => false;
                岛().releasePointerCapture = () => {};
                try {
                    const 点 = { clientX: 框.x + 框.width / 2, clientY: 框.y + 框.height / 2, screenX: 11, screenY: 11 };
                    节点.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, pointerType: "mouse", pointerId: 7, button: 0, buttons: 1, ...点 }));
                    岛().dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerType: "mouse", pointerId: 7, button: 0, ...点 }));
                } finally {
                    岛().setPointerCapture = 原set;
                    岛().hasPointerCapture = 原has;
                    岛().releasePointerCapture = 原release;
                }
            };
            const 单击卡片 = () => 单击元素(document.querySelector(".island-card"));

            // 浮岛令牌由页面探针复制到岛根；用隐藏探针取当前主题下的计算色，避免把十六进制与 rgb 直接比较。
            const 令牌色 = (名) => {
                const 探针 = document.createElement("span");
                探针.style.color = `var(${名})`;
                探针.style.display = "none";
                岛().appendChild(探针);
                const 值 = getComputedStyle(探针).color;
                探针.remove();
                return 值;
            };

            // Web Animations 关键帧按属性名取值，兼容 camelCase 与连字符两种序列化。
            const 帧值 = (帧, 属性) => {
                const 目标 = 属性.replace(/-/g, "").toLowerCase();
                for (const [键, 值] of Object.entries(帧 ?? {})) {
                    if (键.replace(/-/g, "").toLowerCase() === 目标) return 值;
                }
                return undefined;
            };
            const 动画摘要 = (节点) =>
                (节点?.getAnimations?.({ subtree: true }) ?? []).map((动画) => {
                    const 时间 = 动画.effect.getTiming();
                    const 帧 = 动画.effect.getKeyframes();
                    return { 时长: 时间.duration, 延迟: 时间.delay ?? 0, 缓动: 时间.easing, 首帧: 帧[0], 末帧: 帧[帧.length - 1] };
                });

            const 事实 = (来源, 状态, 主信息, 附加, 层 = "event") => ({
                source: 来源,
                layer: 层,
                nowMs: Date.now(),
                unit: { status: 状态, primary: 主信息, secondary: 附加 },
            });
            const 主信息 = "任务正文";
            const 长中文 = "一二三四五六七八九十一二三四五六七八九十"; // 20 个汉字，触发 18 字截断。
            const 长英文 = "abcdefghijklmnopqrstuvwxyzabcdefghijklmn"; // 40 个字符，触发 36 字符截断。

            let 阶段 = "启动"; // 失败结论带上阶段，便于定位断言。
            let 遮蔽证据 = ""; // 遮蔽判定的 DOM 证据摘要：写进最终结论，中途失败也保留。
            let 滚动槽证据 = ""; // 滚动条槽与卡片中心的实测摘要：写进最终结论，中途失败也保留。
            const 运行 = async () => {
                await 直到(() => 岛(), "岛根节点挂载");
                await 直到(() => 夹具.提交.length > 0, "岛完成首次原生几何提交", 8000);
                await 稳定("collapsed");
                阶段 = "遮蔽只在换视口与切态时发生：同视口窗口盒变化不写 hidden";
                // DOM 级证据：直接观察岛根内联 visibility 的写入序列；遮蔽会跨帧保持，微任务回调能读到 hidden。
                const 可见性写入 = [];
                const 观察可见性 = () => {
                    const 目标 = 岛();
                    const 观察器 = new MutationObserver(() => 可见性写入.push(目标.style.visibility || "visible"));
                    观察器.observe(目标, { attributes: true, attributeFilter: ["style"] });
                    return () => 观察器.disconnect();
                };
                const 原贴边 = 夹具.偏好.islandEdge;
                const 原形态 = 夹具.偏好.islandForm;
                const 断言基线 = 失败.length; // 成功句只在整段遮蔽断言都没有新增失败时生成。
                const 断开可见性观察 = 观察可见性();
                try {
                    // 同视口：新消息让胶囊变宽，窗口盒变化但视口带不变，不得整层隐藏。
                    可见性写入.length = 0;
                    const 宽变基线 = 夹具.提交.at(-1);
                    const 宽变前 = 夹具.提交.length;
                    夹具.pushMessages([消息(960, "info", "同视口宽变不遮蔽的正文", "断言来源")]);
                    await 直到(() => 夹具.提交.length > 宽变前, "新消息提交新窗口盒", 8000);
                    await 稳定("collapsed");
                    const 宽变提交 = 夹具.提交.at(-1);
                    断言(JSON.stringify(宽变提交.windowBox) !== JSON.stringify(宽变基线.windowBox), "新消息必须改变窗口盒，否则同视口宽变用例没有覆盖到目标");
                    断言(JSON.stringify(宽变提交.viewport) === JSON.stringify(宽变基线.viewport), "同视口宽变：视口带不得变化");
                    断言(!可见性写入.includes("hidden"), `同视口窗口盒变化不得把 .island 写成 visibility:hidden，实际写入序列 ${可见性写入.join("|") || "无"}`);
                    断言(岛().style.visibility !== "hidden", "同视口窗口盒变化后岛必须保持可见");

                    // 换视口：贴边变化会改固定视口带，必须整层遮蔽一次。
                    可见性写入.length = 0;
                    const 换边前 = 夹具.提交.length;
                    夹具.pushPreferences({ islandEdge: 原贴边 === "left" ? "right" : "left" });
                    await 直到(() => 夹具.提交.length > 换边前, "换贴边提交新几何", 8000);
                    await 稳定("collapsed");
                    const 换边提交 = 夹具.提交.at(-1);
                    断言(JSON.stringify(换边提交.viewport) !== JSON.stringify(宽变基线.viewport), "换贴边用例必须真的换了固定视口带");
                    断言(可见性写入.includes("hidden"), `换视口必须整层遮蔽一次，实际写入序列 ${可见性写入.join("|") || "无"}`);
                    断言(岛().style.visibility !== "hidden", "换视口的遮蔽必须在回包与重绘后解除");
                    夹具.pushPreferences({ islandEdge: 原贴边 });
                    await 稳定("collapsed");
                    // 换边是换视口带：等遮蔽解除（隐藏帧等待会多隔一帧），否则随后的宽变会落进这次遮蔽。
                    await 直到(() => 岛().style.visibility !== "hidden", "换边恢复后遮蔽解除", 5000);

                    // 换边落定（基准已前移）后同一视口再变宽：不得再次整层遮蔽。
                    可见性写入.length = 0;
                    const 换边后基线 = 夹具.提交.at(-1);
                    const 换边后前 = 夹具.提交.length;
                    夹具.pushMessages([消息(961, "info", "换边落定后再变宽的正文", "断言来源")]);
                    await 直到(() => 夹具.提交.length > 换边后前, "换边后新消息提交新窗口盒", 8000);
                    await 稳定("collapsed");
                    const 换边后宽变 = 夹具.提交.at(-1);
                    断言(JSON.stringify(换边后宽变.windowBox) !== JSON.stringify(换边后基线.windowBox), "换边后宽变用例必须真的改变窗口盒");
                    断言(JSON.stringify(换边后宽变.viewport) === JSON.stringify(换边后基线.viewport), "换边后宽变仍在同一视口");
                    断言(!可见性写入.includes("hidden"), `换边落定后胶囊再变宽不得整层遮蔽，实际写入序列 ${可见性写入.join("|") || "无"}`);

                    // 切态：展开与收起都要遮蔽，结束后仍然可见；展开还要等一帧提交后才解除遮蔽。
                    window.__ISLAND_TRACE__ = true; // gated 诊断：只在本段打开，用来核对 paint 与 unmask 之间的帧屏障。
                    window.__ISLAND_TRACE_LOG__ = [];
                    可见性写入.length = 0;
                    await 单击卡片();
                    await 稳定("expanded");
                    const 轨迹 = window.__ISLAND_TRACE_LOG__ ?? [];
                    window.__ISLAND_TRACE__ = false;
                    const 提交下标 = 轨迹.map((项) => 项.stage).lastIndexOf("geometry-commit");
                    const 屏障下标 = 轨迹.findIndex((项, 索引) => 索引 > 提交下标 && 项.stage === "frame-barrier");
                    const 解除下标 = 轨迹.findIndex((项, 索引) => 索引 > 屏障下标 && 项.stage === "unmask");
                    断言(提交下标 >= 0 && 屏障下标 > 提交下标 && 解除下标 > 屏障下标, `展开必须先提交目标布局、再等一帧才解除遮蔽（commit=${提交下标} barrier=${屏障下标} unmask=${解除下标}）`);
                    断言(可见性写入.includes("hidden"), `展开切态必须整层遮蔽一次，实际写入序列 ${可见性写入.join("|") || "无"}`);
                    可见性写入.length = 0;
                    按键("Escape");
                    await 稳定("collapsed");
                    断言(可见性写入.includes("hidden"), `收起切态必须整层遮蔽一次，实际写入序列 ${可见性写入.join("|") || "无"}`);
                    断言(岛().style.visibility !== "hidden", "收起完成后岛必须可见");
                    if (失败.length === 断言基线) 遮蔽证据 = "同视口宽变与换边落定后宽变零 hidden；换贴边与展开/收起各写 hidden 且收起后可见，展开先等视口切到位再解除";
                } finally {
                    window.__ISLAND_TRACE__ = false;
                    断开可见性观察();
                    夹具.pushMessages([]);
                    夹具.pushPreferences({ islandEdge: 原贴边, islandForm: 原形态 });
                }
                await 稳定("collapsed");

                // ---- 展开卡片中心与滚动条槽：槽只扩窗口，不移动卡片 ----
                阶段 = "展开卡片中心与胶囊中心一致：滚动条槽显隐不移动卡片（top 与 right）";
                {
                    const 原贴边 = 夹具.偏好.islandEdge;
                    const 提交 = () => 夹具.提交.at(-1);
                    const 页面左 = (值) => 值.windowBox.left - 值.viewport.left;
                    // 贴边就位：右贴边的窗口右缘贴工作区右边（1920），其它贴边居中（右缘更靠左）。
                    const 贴边就位 = (边) => {
                        const 值 = 提交();
                        if (!值 || 值.state !== "collapsed") return false;
                        const 右缘 = 值.windowBox.left + 值.windowBox.width;
                        return 边 === "right" ? Math.abs(右缘 - 1920) <= 1 : 右缘 <= 1919;
                    }; // 页面坐标：窗口盒相对各自固定视口的落位。
                    const 卡片盒 = () => 岛().querySelector(".island-card").getBoundingClientRect();
                    const 出条 = async (期望, 说明) => 直到(() => (岛().querySelector(".island__scrollbar")?.dataset.visible === "true") === 期望, 说明, 4000).then(() => true).catch(() => false);
                    try {
                        for (const 边 of ["top", "right"]) {
                            夹具.pushPreferences({ islandEdge: 边 });
                            await 稳定("collapsed");
                            // 换贴边是换视口带：等几何真的落到该贴边且遮蔽解除，否则会读到上一贴边的提交。
                            try {
                                await 直到(() => 贴边就位(边) && 岛().style.visibility !== "hidden", `${边}：换贴边提交落地并解除遮蔽`, 5000);
                            } catch (错误) {
                                const 尾 = 夹具.提交.slice(-3).map((项) => `${项.state}@${JSON.stringify(项.windowBox)}/${JSON.stringify(项.viewport)}`);
                                断言(false, `${边}：换贴边提交落地并解除遮蔽超时；最近提交 ${尾.join(" ; ")}；可见性 ${岛().style.visibility}；轨迹 ${(window.__ISLAND_TRACE_LOG__ ?? []).slice(-8).map((项) => 项.stage).join("|")}`);
                            }
                            await 直到(() => 提交()?.state === "collapsed", `${边}：胶囊提交就位`, 5000);
                            const 胶囊 = 提交();
                            // 工作区坐标系：windowBox 都是绝对坐标；上下贴边比水平中心（沿边方向），左右贴边比贴边侧对齐。
                            const 胶囊中心 = 胶囊.windowBox.left + 胶囊.windowBox.width / 2;
                            // 用键盘展开：右贴边胶囊在 1040 高工作区里竖直居中，页面 fixture 的 520 高视口点不到它。
                            按键("Enter");
                            try {
                                await 稳定("expanded");
                            } catch (error) {
                                const 值 = 提交();
                                断言(false, `${边} 贴边：${error instanceof Error ? error.message : String(error)}（当前态 ${岛().dataset.state} / 提交 ${值?.state} ${JSON.stringify(值?.windowBox)}）`);
                                continue;
                            }
                            await 直到(() => 提交()?.state === "expanded", `${边}：展开提交就位`, 5000);
                            const 展开 = 提交();
                            // 窗口 = 卡片内容 + 16 DIP 槽；贴右边时槽在卡片左侧，卡片始终贴边。
                            const 槽起始 = 边 === "right" ? 16 : 0;
                            const 内容宽 = 展开.cards[0].rect.width;
                            const 内容高 = 展开.cards[0].rect.height;
                            断言(展开.windowBox.width === 内容宽 + 16, `${边} 贴边：窗口盒必须比卡片内容宽一条 16 DIP 槽，实际 ${展开.windowBox.width}/${内容宽}`);
                            if (边 === "right") {
                                // 右贴边时卡片贴右缘、槽在左：比右缘对齐；展开列占满工作区高度，竖直方向没有中心可比。
                                断言(展开.windowBox.left + 展开.windowBox.width === 胶囊.windowBox.left + 胶囊.windowBox.width, `right 贴边：窗口右缘必须与胶囊右缘对齐，实际 ${展开.windowBox.left + 展开.windowBox.width}/${胶囊.windowBox.left + 胶囊.windowBox.width}`);
                            } else {
                                // 上下贴边沿水平方向居中：比卡片水平中心。
                                const 展开中 = 展开.windowBox.left + 内容宽 / 2;
                                const 中心差 = Math.abs(展开中 - 胶囊中心);
                                断言(中心差 <= 1, `${边} 贴边：展开卡片中心必须与胶囊中心一致，实际差 ${中心差.toFixed(2)} DIP（胶囊 ${胶囊中心.toFixed(1)} / 展开 ${展开中.toFixed(1)}）`);
                                滚动槽证据 = `${滚动槽证据}${边} 中心差 ${中心差.toFixed(2)} DIP；`;
                            }
                            // 终帧列：展开分支在恢复相对流之前写最终列，不能沿用上一帧并集列。
                            const 终帧列 = Number.parseFloat(岛().style.getPropertyValue("--island-expanded-column") || "0");
                            断言(Math.abs(终帧列 - 页面左(展开)) <= 1, `${边} 贴边：终帧列偏移必须等于最终请求（实际 ${终帧列.toFixed(1)} / ${页面左(展开).toFixed(1)}）`);
                            const 无溢出盒 = 卡片盒();
                            断言(Math.abs(无溢出盒.width - 内容宽) <= 1, `${边} 贴边：卡片宽应等于内容宽，实际 ${无溢出盒.width.toFixed(1)}/${内容宽}`);
                            const 根左 = 岛().getBoundingClientRect().left;
                            断言(Math.abs(无溢出盒.left - 根左 - (页面左(展开) + 槽起始)) <= 1, `${边} 贴边：卡片左边缘必须落在列偏移处，实际 ${(无溢出盒.left - 根左).toFixed(1)}/${(页面左(展开) + 槽起始).toFixed(1)}`);
                            // 内容变高触发出条：卡片 x / 宽必须不变（槽提前预留，不随显隐切换）。
                            const 样式 = document.createElement("style");
                            样式.textContent = '.island[data-state="expanded"] .island-card{block-size:1200px}';
                            document.head.append(样式);
                            const 已出条 = await 出条(true, `${边} 贴边：卡片变高后出现滚动条`);
                            断言(已出条, `${边} 贴边：内容溢出后必须出现滚动条`);
                            const 有溢出盒 = 卡片盒();
                            断言(Math.abs(有溢出盒.left - 无溢出盒.left) <= 0.5 && Math.abs(有溢出盒.width - 无溢出盒.width) <= 0.5, `${边} 贴边：滚动条显隐不得改变卡片 x/宽（${无溢出盒.left.toFixed(1)}/${无溢出盒.width.toFixed(1)} → ${有溢出盒.left.toFixed(1)}/${有溢出盒.width.toFixed(1)}）`);
                            滚动槽证据 = `${滚动槽证据}${边}: 窗口 ${展开.windowBox.width}=内容 ${内容宽}+16、卡片 ${无溢出盒.width.toFixed(1)} 宽 / 出条后 ${有溢出盒.width.toFixed(1)}；`.replace(/\s+/g, " ");
                            样式.remove();
                            await 出条(false, `${边} 贴边：撤掉高卡片后条收起`);
                            await 稳定("expanded");
                            按键("Escape");
                            await 稳定("collapsed");
                        }
                    } finally {
                        夹具.pushPreferences({ islandEdge: 原贴边 });
                    }
                    await 稳定("collapsed");
                }

                // ---- 收起不淡出内容：全过程 opacity ≥ 0.99，结束后内联值清空 ----
                阶段 = "收起不淡出：内容 opacity 全过程 ≥0.99，结束后内联 opacity/filter 清空";
                {
                    await 稳定("collapsed");
                    await 直到(() => 岛().style.visibility !== "hidden", "收起用例：初始遮蔽解除", 5000);
                    按键("Enter");
                    await 稳定("expanded");
                    const 内容 = 岛().querySelector(".island-card__content");
                    断言(Boolean(内容), "展开态必须有卡片内容节点");
                    if (内容) {
                        const 采样 = [];
                        let 采样中 = true;
                        const 记录 = () => {
                            采样.push(Number.parseFloat(getComputedStyle(内容).opacity));
                            if (采样中) requestAnimationFrame(记录);
                        };
                        requestAnimationFrame(记录);
                        按键("Escape");
                        await 稳定("collapsed");
                        await 等待(320); // 动画时长（240ms）之后再看内联值是否清空。
                        采样中 = false;
                        采样.push(Number.parseFloat(getComputedStyle(内容).opacity));
                        const 最低 = Math.min(...采样);
                        断言(最低 >= 0.99, `收起全过程内容 opacity 不得下降（最低 ${最低.toFixed(2)}，采样 ${采样.length} 次）`);
                        断言(!内容.style.opacity && !内容.style.filter, `收起结束后内联 opacity/filter 必须为空，实际 "${内容.style.opacity}"/"${内容.style.filter}"`);
                    }
                }

                // ---- 并集动画期间取消：submission 必须收口 ----
                阶段 = "并集动画期间取消：submission 收口，展开后立刻 Esc 仍能收起";
                {
                    await 稳定("collapsed");
                    await 直到(() => 岛().style.visibility !== "hidden", "取消用例：遮蔽解除", 5000);
                    按键("Enter");
                    await 直到(() => 当前态() === "expanded", "取消用例：进入展开", 4000);
                    await 等待(30); // 并集动画进行中。
                    按键("Escape");
                    try {
                        await 稳定("collapsed");
                    } catch (error) {
                        断言(false, `动画期间取消后必须仍能收起：${error instanceof Error ? error.message : String(error)}`);
                    }
                    断言(当前态() === "collapsed", "动画期间取消后必须回到胶囊");
                    断言(岛().style.visibility !== "hidden", "取消收口后必须解除遮蔽");
                }

                // ---- 一、零锚点空态与胶囊只读语义 ----

                阶段 = "一、零锚点空态与胶囊只读语义";
                const 时钟 = 锚点("clock");
                断言(Boolean(时钟), "零锚点必须显示空态圆锚点");
                const 时钟文本节点 = 时钟?.parentElement?.querySelector(".island-anchor__clock") ?? null;
                const 时钟文本 = 时钟文本节点?.textContent ?? "";
                断言(/^\d{2}:\d{2}$/.test(时钟文本), `空态时钟应显示在圆锚点右侧，实际 ${时钟文本}`);
                断言(时钟文本节点 !== null && Number.parseFloat(getComputedStyle(时钟文本节点).fontSize) >= 13, `空态时钟字号应不小于 13px，实际 ${时钟文本节点 ? getComputedStyle(时钟文本节点).fontSize : "无节点"}`);
                const [时, 分] = 时钟文本.split(":").map(Number);
                const 当前时间 = new Date();
                断言(Math.abs(时 * 60 + 分 - (当前时间.getHours() * 60 + 当前时间.getMinutes())) <= 1, `空态时钟应与当前时间一致，实际 ${时钟文本}`);
                断言(胶囊锚点().length === 1, `零锚点只应有一个空态圆，实际 ${胶囊锚点().length}`);
                断言(胶囊行().querySelectorAll("button").length === 0, "胶囊必须是只读的，不得出现按钮");
                断言(岛().tabIndex === -1, `胶囊不得进入 Tab 顺序，实际 tabIndex=${岛().tabIndex}`);
                断言([...胶囊行().querySelectorAll("*")].every((节点) => 节点.tabIndex < 0), "胶囊内不得有可聚焦元素");
                断言(胶囊锚点().every((节点) => 节点.tagName === "SPAN" && !节点.hasAttribute("role")), "胶囊锚点必须是只读 span，不得成为按钮或可聚焦控件");
                await 单击卡片();
                await 稳定("expanded");
                断言(Boolean(卡片()), "零锚点空态仍必须可单击展开");
                按键("Escape");
                await 稳定("collapsed");

                // ---- 二、十种基础状态逐条：视觉差异、固定短词与结束后去向 ----

                阶段 = "二、十种基础状态逐条：视觉差异、固定短词与结束后去向";
                // 取消/完成的去向是「直接消失」「收成圆点」，其符号与短词由真实模型给出并在本页断言；
                // 取消态按规格不渲染 DOM，因此同时断言它没有留下锚点或播报。
                const 状态用例 = [
                    { 状态: "pending", 词: "待开始", 形: "ring", 符号: "", 去向: "linger", 强调: "--fence-text" },
                    { 状态: "running", 词: "进行中", 形: "ring", 符号: "", 去向: "linger", 强调: "--fence-active", 附加: "40%" },
                    { 状态: "paused", 词: "暂停", 形: "glyph", 符号: "pause", 去向: "linger", 强调: "--fence-text" },
                    { 状态: "completed", 词: "完成", 形: "glyph", 符号: "check", 去向: "dot", 强调: "--fence-text" },
                    { 状态: "failed", 词: "失败", 形: "glyph", 符号: "alert", 去向: "linger", 强调: "--fence-error" },
                    { 状态: "cancelled", 词: "取消", 形: "glyph", 符号: "cross", 去向: "vanish", 强调: "--fence-text" },
                    { 状态: "awaiting", 词: "待确认", 形: "glyph", 符号: "question", 去向: "linger", 强调: "--fence-warning" },
                    { 状态: "disconnected", 词: "未连接", 形: "glyph", 符号: "link-off", 去向: "linger", 强调: "--fence-text" },
                    { 状态: "unauthorized", 词: "未授权", 形: "glyph", 符号: "lock", 去向: "linger", 强调: "--fence-text" },
                    { 状态: "indeterminate", 词: "运行中", 形: "sweep", 符号: "", 去向: "linger", 强调: "--fence-active" },
                ];
                for (const 用例 of 状态用例) {
                    const 来源 = `状态-${用例.状态}`;
                    const 身份 = `event:${来源}`;
                    const 规格 = ISLAND_STATUS_SPECS[用例.状态];
                    const 模型字形 = islandAnchorGlyph(用例.状态, 0.4);
                    断言(规格?.word === 用例.词, `${用例.状态} 的固定短词应为 ${用例.词}，实际 ${规格?.word}`);
                    断言(规格?.disposition === 用例.去向, `${用例.状态} 的结束去向应为 ${用例.去向}，实际 ${规格?.disposition}`);
                    断言(模型字形.kind === 用例.形, `${用例.状态} 的视觉种类应为 ${用例.形}，实际 ${模型字形.kind}`);
                    if (用例.形 === "glyph") 断言(模型字形.symbol === 用例.符号, `${用例.状态} 的符号应为 ${用例.符号}，实际 ${模型字形.symbol}`);
                    if (用例.状态 === "running") 断言(模型字形.arc === 0.4, `进行中弧长应随 40% 进度，实际 ${模型字形.arc}`);
                    if (用例.状态 === "pending") 断言(模型字形.arc === 0, "待开始必须是空环");

                    渲染({ contentFacts: [事实(来源, 用例.状态, 主信息, 用例.附加)] });
                    if (用例.去向 === "vanish") {
                        await 直到(() => 播报() === "" && Boolean(锚点("clock")), `${用例.状态} 直接消失并回落空态`, 4000);
                        断言(!锚点(身份), "取消状态必须直接消失，不保留锚点");
                        断言(!播报().includes(用例.词), "取消状态不得进入播报");
                        continue;
                    }
                    await 直到(() => 墨(身份), `${用例.状态} 锚点渲染`);
                    const 墨节点 = 墨(身份);
                    断言(墨节点.dataset.status === 用例.状态, `${用例.状态} 锚点 data-status 应为自身，实际 ${墨节点.dataset.status}`);
                    断言(墨节点.dataset.glyph === 用例.形, `${用例.状态} 锚点 data-glyph 应为 ${用例.形}，实际 ${墨节点.dataset.glyph}`);
                    断言((墨节点.dataset.symbol ?? "") === 用例.符号, `${用例.状态} 锚点 data-symbol 应为 ${用例.符号}，实际 ${墨节点.dataset.symbol}`);
                    if (用例.形 === "ring") {
                        断言(Boolean(墨节点.querySelector(".island-anchor__track")), `${用例.状态} 必须绘制轨道`);
                        const 实线弧 = [...墨节点.querySelectorAll("svg path")];
                        if (用例.状态 === "pending") 断言(实线弧.length === 0, "待开始为空环，不得绘制已播弧");
                        else 断言(实线弧.length === 1 && /A8\.5/.test(实线弧[0].getAttribute("d") ?? ""), "进行中必须用 SVG path 实线弧表示进度");
                        断言(!墨节点.innerHTML.includes("stroke-dasharray"), `${用例.状态} 进度环不得用 stroke-dasharray 模拟`);
                    } else if (用例.形 === "sweep") {
                        const 扫 = 墨节点.querySelector(".island-anchor__sweep");
                        断言(Boolean(扫), "无总量运行中必须绘制不定弧");
                        if (减少动效) 跳过.push("不定弧动画标记");
                        else 断言(扫.dataset.motion === "true", `不定弧应带 data-motion=true，实际 ${扫.dataset.motion}`);
                        断言(/^M10 1\.5 A8\.5/.test(扫.getAttribute("d") ?? ""), "不定弧必须是 SVG 实线弧");
                        断言(!墨节点.innerHTML.includes("stroke-dasharray"), "不定弧不得用 stroke-dasharray 模拟");
                    } else if (["pause", "check", "alert", "cross"].includes(用例.符号)) {
                        断言(Boolean(墨节点.querySelector(".island-anchor__icon svg")), `${用例.状态} 必须使用内置图标绘制符号`);
                    } else {
                        断言(Boolean(墨节点.querySelector("svg path")?.getAttribute("d")), `${用例.状态} 必须用路径绘制符号`);
                        断言(!墨节点.querySelector(".island-anchor__icon"), `${用例.状态} 不应复用其他状态的图标`);
                    }
                    const 颜色 = getComputedStyle(墨节点).color;
                    断言(颜色 === 令牌色(用例.强调), `${用例.状态} 锚点颜色应为 ${用例.强调}，实际 ${颜色}`);
                    断言(播报().includes(`${来源} · ${用例.词}`), `${用例.状态} 播报必须包含来源与短词，实际 ${播报()}`);
                    if (用例.状态 === "running") 断言(播报().includes(" · 25%"), `进行中播报应带 25% 里程碑，实际 ${播报()}`);
                    else 断言(播报().includes(主信息), `${用例.状态} 播报必须带关键值（主信息），实际 ${播报()}`);
                    if (用例.去向 === "dot") {
                        断言(!文案(身份), "完成状态必须收成圆点，不得保留内容行");
                        断言(卡片().getBoundingClientRect().width < 100, `完成后宽度应按圆收缩，实际 ${卡片().getBoundingClientRect().width}`);
                    } else {
                        断言(文案(身份)?.textContent?.startsWith(主信息), `${用例.状态} 应显示一行主信息，实际 ${文案(身份)?.textContent}`);
                    }
                }

                // ---- 三、几何与排版 ----

                阶段 = "三、几何与排版";
                断言(getComputedStyle(岛()).getPropertyValue("--island-anchor-size").trim() === "28px", "锚点尺寸令牌应为 28px");
                断言(getComputedStyle(岛()).getPropertyValue("--island-anchor-gap").trim() === "12px", "锚点间距令牌应为 12px");
                断言(getComputedStyle(岛()).getPropertyValue("--island-anchor-grow").trim() === "300ms", "生长节奏令牌应为 300ms");
                断言(getComputedStyle(岛()).getPropertyValue("--island-anchor-shrink").trim() === "240ms", "收缩节奏令牌应为 240ms");

                const 九枚 = Array.from({ length: 9 }, (_, 序) => 事实(`数量-${序 + 1}`, "pending", `锚点${序 + 1}`));
                渲染({ contentFacts: 九枚 });
                await 直到(() => 胶囊锚点().length === 4, "胶囊折成 3 枚实体 + ＋N", 4000);
                const 实体锚点 = 胶囊锚点().filter((节点) => 节点.dataset.anchor !== "overflow");
                断言(实体锚点.length === 3, `胶囊最多并排 3 枚实体锚点，实际 ${实体锚点.length}`);
                断言(胶囊锚点().length === 4, "第 4 枚起必须折成一枚「＋N」圆");
                // F9：用真实 pointerdown/pointerup 落在锚点区域内，验证整条胶囊均可单击展开；
                // 不再用 dispatchEvent(new MouseEvent("click")) 这种绕过命中与长按判定的事件伪造通过。

                await 稳定("expanded");
                const 退回测量前 = 夹具.提交.length;
                const 原点 = 岛().getBoundingClientRect();
                // 用窗口相对固定视口的坐标，不将断言容器的 24px 画布内边距误算成真实窗口坐标。
                const 原生左 = 全高几何.windowBox.left - 全高几何.viewport.left;
                const 原生顶 = 全高几何.windowBox.top - 全高几何.viewport.top;
                const 空列点 = { x: 原生左 + 卡列宽 / 2, y: 原生顶 + 全高几何.windowBox.height - 2 };
                断言(空列点.y - 原生顶 > 卡片们.at(-1).getBoundingClientRect().bottom - 原点.top, "测试点是末张卡片下方透明列而非卡片或窗口外");
                const 移动 = (x, y) => document.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, pointerType: "mouse", clientX: x, clientY: y }));
                const 原定时 = window.setTimeout;
                let 空白定时数 = 0;
                window.setTimeout = (回调, 延迟, ...args) => {
                    if (延迟 === 120) 空白定时数++;
                    return 原定时.call(window, 回调, 延迟, ...args);
                };
                try {
                    移动(空列点.x, 原生顶 + 10); // 从实际内容侧出发。
                    移动(空列点.x, 空列点.y);
                    for (let i = 1; i <= 12; i++) 移动(空列点.x, 空列点.y - i);
                    断言(当前态() === "expanded" && 空白定时数 === 1, "空白列反复移动只注册一次回退计时");
                    // 回到另一张卡片，尚未到点的回退应立即取消。
                    const 天气框 = 三卡[2].getBoundingClientRect();
                    移动(空列点.x, 原生顶 + 天气框.top - 原点.top + 10);
                    await 等待(140);
                    断言(当前态() === "expanded", "重新进入任一卡片后超过原截止仍保持展开");
                    const 进列时刻 = performance.now();
                    移动(空列点.x, 空列点.y);
                    for (let i = 1; i <= 12; i++) 移动(空列点.x, 空列点.y - i);
                    await 直到(() => 当前态() === "collapsed", "连续停留后回落胶囊");
                    const 实测停留 = performance.now() - 进列时刻;
                    断言(空白定时数 === 2 && 实测停留 >= 119, `两个真实离开边界各一笔 120ms 计时，实际 ${空白定时数} 笔/${实测停留}ms`);
                } finally { window.setTimeout = 原定时; }
                await 稳定("collapsed");
                断言(JSON.stringify(夹具.提交.at(-1).windowBox) === 胶囊盒 && 夹具.提交.length - 退回测量前 === 1, "满 120ms 回落，精确恢复胶囊盒并只提交一次");
                const 胶囊几何 = 夹具.提交.at(-1);
                const 胶囊中心 = { x: 胶囊几何.windowBox.left - 胶囊几何.viewport.left + 胶囊几何.windowBox.width / 2, y: 胶囊几何.windowBox.top - 胶囊几何.viewport.top + 胶囊几何.windowBox.height / 2 };
                悬停();
                移动(胶囊中心.x, 胶囊中心.y);
                await 等待(210);
                断言(当前态() === "collapsed", "旧指针在收缩后的胶囊上保持不回弹，必须先离开再进入");
                const 再进入前 = 夹具.提交.length;
                按键("Enter");
                await 稳定("expanded");
                断言(夹具.提交.length - 再进入前 === 1 && JSON.stringify(夹具.提交.at(-1).windowBox) === 全高盒, "再入态重新且只提交一次工作区全高盒");
                按键("Escape");
                await 稳定("collapsed");

                阶段 = "展开全高窗口的四边卡列对齐";
                const 各边位置 = [];
                for (const 边 of ["top", "bottom", "left", "right"]) {
                    夹具.pushPreferences({ islandEdge: 边, islandForm: "capsule", interfaceAnimations: false });
                    await 直到(() => 岛().dataset.edge === 边, `切换到 ${边}`);
                    await 稳定("collapsed");
                    按键("Enter");
                    await 稳定("expanded");
                    const 窗 = 岛().getBoundingClientRect();
                    const 几何 = 夹具.提交.at(-1);
                    const 列 = [...岛().querySelectorAll(".island-card")];
                    const 首 = 列[0].getBoundingClientRect().top - 窗.top;
                    const 尾 = 窗.bottom - 列.at(-1).getBoundingClientRect().bottom;
                    各边位置.push(`${边} 首 ${首.toFixed(1)} / 尾距底 ${尾.toFixed(1)} DIP`);
                    断言(几何.windowBox.top === 0 && 几何.windowBox.height === 1040, `${边} 展开盒一直全高`);
                    断言(近似(几何.cards[0].rect.top, 首, 0.1), `${边} 初次几何提交已含实际对齐，不把首卡提交到错误位置`);
                    断言(边 === "top" ? 近似(首, 0, 0.1) : 边 === "bottom" ? 首 > 0 && 近似(尾, 6, 0.1) : 首 > 0 && 近似(首, 尾, 0.1), `${边} 对齐首距 ${首}，尾距 ${尾}`);
                    const 同盒前 = 夹具.提交.length;
                    const 开关 = 岛().querySelector('.island-card[aria-label="音乐控制"] .island-card__toggle');
                    const 原状态 = 开关.getAttribute("aria-expanded");
                    for (const 值 of [String(原状态 !== "true"), 原状态]) {
                        开关.click();
                        await 直到(() => 开关.getAttribute("aria-expanded") === 值, `${边} 卡片内部切换`);
                        await 等待(70);
                    }
                    断言(夹具.提交.length === 同盒前, `${边} 折叠/展开不得提交新窗口盒`);
                    if (边 === "bottom") {
                        const 超高 = document.createElement("style");
                        超高.textContent = '.island[data-state="expanded"] .island-card { min-block-size: 450px; }';
                        document.head.append(超高);
                        try {
                            await 直到(() => 岛().scrollHeight > 岛().clientHeight && 岛().querySelector('.island__scrollbar').dataset.visible === "true", "贴底内容超高时出现滚动条");
                            断言(近似(列[0].getBoundingClientRect().top, 岛().getBoundingClientRect().top, 0.1), "贴底超高时安全回顶部，不丢首卡");
                            岛().scrollTop = 岛().scrollHeight;
                            await 直到(() => 岛().scrollTop > 0 && Number(岛().querySelector('.island__scrollbar').getAttribute('aria-valuenow')) > 0, "贴底超高时可以向下滚动并更新滑块");
                            断言(列.at(-1).getBoundingClientRect().bottom <= 岛().getBoundingClientRect().bottom + 0.1 && 夹具.提交.length === 同盒前, "尾卡可滚入视口，窗口仍零提交");
                        } finally { 超高.remove(); 岛().scrollTop = 0; }
                    }
                    按键("Escape");
                    await 稳定("collapsed");
                }
                夹具.pushPreferences({ islandEdge: "top", islandForm: "notch" });
                await 直到(() => 岛().dataset.edge === "top", "恢复主场景贴顶");
                悬停();
                await 稳定("hover");

                阶段 = "插件自绘 hover 生命周期";
                const { PluginSlot } = await import('../components/PluginSlot.tsx');
                const { bindPluginApi, pluginModules, loadPluginScript } = await import('../../bridge/pluginScripts.ts');
                const 原模块加载 = pluginModules.load;
                pluginModules.load = async () => ({ default: {} });
                const 插件容器 = document.createElement('div');
                容器.append(插件容器);
                const 插件根 = createRoot(插件容器);
                let 绘制次数 = 0;
                let 清理次数 = 0;
                const 插件清单 = { id: 'plugin.hover-fixture', name: '自绘插件', script: '' };
                bindPluginApi(插件清单.id, { renderIslandHover: (容器, 上下文) => {
                    绘制次数++;
                    const 自绘 = document.createElement('article');
                    自绘.dataset.customHover = 上下文.instanceId;
                    自绘.textContent = '插件决定自己的 DOM';
                    容器.append(自绘);
                    return () => { 清理次数++; 自绘.remove(); };
                } });
                const 绘制插件 = (instanceId) => 插件根.render(React.createElement(PluginSlot, { manifest: 插件清单, instanceId, collapsed: false, hover: true }));
                await loadPluginScript(插件清单.id, 'fixture/hover.js');
                绘制插件('island.plugin.hover-fixture');
                await 直到(() => 插件容器.querySelector('article[data-custom-hover]'), '插件自定义 DOM 挂载');
                断言(绘制次数 === 1 && 清理次数 === 0, '首轮自绘只挂载一次');
                绘制插件('island.plugin.hover-next');
                await 直到(() => 插件容器.querySelector('[data-custom-hover="island.plugin.hover-next"]'), '切换插件实例');
                断言(绘制次数 === 2 && 清理次数 === 1, '切换先清理上一轮');
                插件根.unmount();
                断言(清理次数 === 2, '卸载调用最后一轮清理');
                const 失败根 = createRoot(插件容器);
                const 失败清单 = { id: 'plugin.hover-failed', name: '失败插件', script: '' };
                bindPluginApi(失败清单.id, { renderIslandHover: () => { throw new Error('预期的插件渲染异常'); } });
                await loadPluginScript(失败清单.id, 'fixture/failed.js');
                pluginModules.load = 原模块加载;
                失败根.render(React.createElement(PluginSlot, { manifest: 失败清单, instanceId: 'island.plugin.hover-failed', collapsed: false, hover: true }));
                await 直到(() => 插件容器.textContent.includes('组件渲染失败'), '插件异常收口到既有失败态');
                断言(岛().isConnected, '插件异常不打断浮岛');
                失败根.unmount();
                插件容器.remove();

                阶段 = "逐功能显示开关与 hover 方向键回落";
                功能图标场景 = false;
                插件锚点场景 = true;
                const 音乐锚点 = "event:音乐控制";
                const 插件锚点 = "resident:插件锚点夹具";
                const 样例通知 = 消息(900, "error", "真实通道的失败通知", "真实来源");
                const 功能 = [["music", 音乐锚点], ["message", 通知锚点], ["plugin", 插件锚点]];
                夹具.pushPreferences({ islandAnchorVisible: {} });
                夹具.pushMessages([]);
                重新挂载();
                await 直到(() => 锚点(插件锚点), "真实快照挂载插件");
                夹具.pushMusic(媒体("后台继续播放", "测试艺人"));
                await 直到(() => 锚点(音乐锚点), "播放会话占有音乐锚点");
                悬停();
                await 稳定("hover");
                锚点(音乐锚点).click();
                await 直到(() => 锚点(音乐锚点).getAttribute("aria-pressed") === "true", "上一轮 hover 选中音乐");
                按键("Escape");
                await 稳定("collapsed");
                夹具.pushMessages([样例通知]);
                await 直到(() => 胶囊锚点().length === 3 && 文案(通知锚点)?.textContent.includes(样例通知.content), "新消息接管胶囊正文且音乐仍在");
                悬停();
                await 稳定("hover");
                断言(悬停按钮()[0] !== 锚点(通知锚点) && 锚点(通知锚点).getAttribute("aria-pressed") === "true" && 通知行().length === 1,
                    "再次进入 hover 要选中胶囊正在显示的消息，而不是第一枚或上一轮选中的音乐");

                阶段 = "hover 功能图标安全区";
                const 事件锚点 = "event:图标测试";
                渲染({ contentFacts: [事实("图标测试", "pending", "普通事件")] });
                await 直到(() => 锚点(事件锚点) && 近似(图标盒(锚点(通知锚点)).getBoundingClientRect().width, 16, 0.02), "普通事件进入 hover 行，初选铃铛完成缩放");
                for (const 身份 of [音乐锚点, 通知锚点, 插件锚点, 事件锚点]) {
                    const 按钮 = 锚点(身份);
                    const 图标 = 按钮.querySelector(".island-anchor__icon");
                    const 图形 = 图标.querySelector("svg");
                    const 图框 = 图形.getBoundingClientRect();
                    const 安全区 = 图标.getBoundingClientRect();
                    const 圆框 = 按钮.getBoundingClientRect();
                    const 像素 = 图形.getBBox();
                    const 视口 = 图形.viewBox.baseVal;
                    const 边长 = 按钮.getAttribute("aria-pressed") === "true" ? 16 : 20;
                    const 内缩 = (28 - 边长) / 2;
                    断言(近似(图框.width, 边长, 0.1) && 近似(图框.height, 边长, 0.1) && 近似(图框.left, 安全区.left, 0.1) && 近似(图框.top, 安全区.top, 0.1), `${身份} 的 SVG 等比落在安全区，绘制 ${边长}×${边长}，实际 ${图框.width}×${图框.height}`);
                    断言(getComputedStyle(图标).overflow === "visible" && 像素.width > 0 && 像素.height > 0 && 像素.x >= 视口.x && 像素.y >= 视口.y && 像素.x + 像素.width <= 视口.x + 视口.width && 像素.y + 像素.height <= 视口.y + 视口.height, `${身份} 的图形不能被图标圆角蒙版或 SVG 视口截断`);
                    断言(近似(圆框.width, 28, 0.1) && 近似(圆框.height, 28, 0.1) && 近似(安全区.left - 圆框.left, 内缩, 0.1) && 近似(安全区.top - 圆框.top, 内缩, 0.1), `${身份} 按钮不随选中缩放改变，只增加缩小图形的留白`);
                }
                渲染();
                按键("Escape");
                await 稳定("collapsed");
                await 直到(() => !锚点(事件锚点), "清理仅用于测试的普通事件");
                for (const [类型, 身份] of 功能) {
                    夹具.pushPreferences({ islandAnchorVisible: { [类型]: false } });
                    await 直到(() => !锚点(身份), `${类型} 胶囊撤下`);
                    断言(功能.filter(([, 值]) => 值 !== 身份).every(([, 值]) => 锚点(值)), `${类型} 不连动另外两种胶囊锚点`);
                    悬停();
                    await 稳定("hover");
                    断言(!锚点(身份) && 悬停按钮().length === 2, `${类型} 同步从 hover 撤下`);
                    按键("Escape");
                    await 稳定("collapsed");
                    夹具.pushPreferences({ islandAnchorVisible: {} });
                    await 直到(() => Boolean(锚点(身份)), `${类型} 重新启用后原事实可见`);
                }
                悬停();
                await 稳定("hover");
                锚点(通知锚点).click();
                锚点(通知锚点).focus();
                await 直到(() => 通知行().length === 1, "撤下前选中通知详情");
                const 待回落 = 悬停按钮().filter((节点) => 节点.dataset.anchor !== 通知锚点);
                夹具.pushPreferences({ islandAnchorVisible: { message: false } });
                await 直到(() => !锚点(通知锚点) && !通知行().length && !播报().includes(样例通知.content), "撤下当前项后详情、计数与播报都更新");
                const 回落 = 悬停按钮().find((节点) => 节点.getAttribute("aria-pressed") === "true");
                断言(回落 === 待回落[0] && document.activeElement === 回落, `当前项撤下后选中并聚焦首个可用锚点，实际 ${回落?.dataset.anchor} / ${document.activeElement?.dataset.anchor ?? document.activeElement?.tagName}`);
                回落?.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
                await 直到(() => 待回落[1]?.getAttribute("aria-pressed") === "true", "方向键在仍可见的两项间移动");
                夹具.pushPreferences({ islandAnchorVisible: { message: false, music: false, plugin: false } });
                await 直到(() => !悬停按钮().length && 锚点("clock"), "全部撤下时回落时钟");
                按键("Enter");
                await 稳定("expanded");
                for (const 名称 of ["消息", "音乐控制", "插件锚点夹具"]) 断言(岛().querySelector(`.island-card[aria-label="${名称}"]`), `${名称}的展开卡不受显示开关影响`);

                阶段 = "旧演示参数不注册定时器，真实消息仍到达";
                const 页面地址 = location.href;
                const 原注册 = window.setInterval;
                const 周期 = [];
                window.setInterval = (回调, 毫秒, ...参数) => {
                    周期.push(毫秒);
                    return 原注册.call(window, 回调, 毫秒, ...参数);
                };
                try {
                    const 旧地址 = new URL(页面地址);
                    旧地址.searchParams.set("demo", "1");
                    history.replaceState(null, "", 旧地址);
                    夹具.pushPreferences({ islandAnchorVisible: {} });
                    夹具.pushMessages([样例通知]);
                    重新挂载();
                    await 直到(() => 计数文本() === "1" && 锚点(插件锚点), "旧参数下仍挂载真实通知与插件锚点");
                    夹具.pushMusic(媒体("后台继续播放", "测试艺人"));
                    await 直到(() => 锚点(音乐锚点), "真实媒体仍可接入");
                    const 后到 = 消息(901, "info", "后来收到的真实消息", "真实新来源");
                    夹具.pushMessages([样例通知, 后到]);
                    await 直到(() => 计数文本() === "2" && 播报().includes(后到.content), "只合并真正到达的通知");
                    断言(!周期.includes(6000), `旧演示参数不得注册 6s 轮转定时器，实际周期 ${周期.join(",")}`);
                } finally {
                    根.unmount();
                    window.setInterval = 原注册;
                    history.replaceState(null, "", 页面地址);
                }
                report(
                    失败.length
                        ? `FAIL\n- ${失败.join("\n- ")}${遮蔽证据 ? `\n（遮蔽 DOM 证据：${遮蔽证据}）` : ""}${滚动槽证据 ? `\n（滚动槽实测：${滚动槽证据}）` : ""}`
                        : 跳过.length
                          ? `SKIP：系统开启减少动效，跳过 ${跳过.join("、")}；其余三卡折叠/展开、几何、键盘、通知开关与隐藏合并通过`
                          : `PASS 浮岛内容层：三卡折叠/展开 ${内部提交数} 次窗口提交；${各边位置.join("；")}；${遮蔽证据}；几何、键盘、通知开关；无演示轮转`,
                );
            };

            渲染();
            运行().catch((错误) => {
                report(`FAIL\n- ${阶段}：${错误 instanceof Error ? 错误.message : String(错误)}${失败.length ? `\n- ${失败.join("\n- ")}` : ""}${遮蔽证据 ? `\n（遮蔽 DOM 证据：${遮蔽证据}）` : ""}${滚动槽证据 ? `\n（滚动槽实测：${滚动槽证据}）` : ""}`);
            });
        </script>
    </body>
</html>
