<!doctype html>
<html lang="zh-CN">
    <meta charset="utf-8" />
    <title>浮岛内容层十态、边界与切换时序检查</title>
    <style>
        html,
        body {
            margin: 0;
            background: #d6c3bb;
        }
        #fixture {
            position: relative;
            padding: 24px;
            width: 900px;
            height: 520px;
            background: linear-gradient(120deg, #d8c3b8 0%, #e7d7cd 45%, #c9a89f 100%);
        }
        #result {
            position: fixed;
            left: 8px;
            bottom: 8px;
            margin: 0;
            padding: 8px;
            background: #000c;
            color: #7dff9b;
            font: 12px/1.5 monospace;
            white-space: pre-wrap;
        }
    </style>
    <body>
        <script>
            // 模块加载失败、未处理异常和隐藏页面也必须有界写出结论。
            const failAssertion = (reason) => {
                const result = document.getElementById("result");
                if (result && !/^(PASS|FAIL)/.test(result.textContent)) {
                    result.textContent = `FAIL\\n- ${reason}`;
                    document.body.dataset.phase = "fail";
                }
            };
            window.addEventListener("error", (event) => failAssertion(event.message || "断言模块加载失败"), true);
            window.addEventListener("unhandledrejection", (event) => failAssertion(String(event.reason)));
            setTimeout(() => failAssertion("断言总时限 60000ms：页面状态或动画未收敛"), 60000);
        </script>
        <main id="fixture"></main>
        <pre id="result">RUNNING</pre>
        <script type="module">
            // 证据层：L1 浏览器断言（真实 React 组件 + 真实 CSS）。原生投放 OLE 进入/离开顺序、WebView2
            // 真实合成的材质与观感仍由 L3 真机覆盖；本页只判定 DOM、dataset 与计算样式。
            import { 创建夹具, 消息, 媒体, 时间轴, 逐句歌词, 等待, 直到 } from "./islandFixture.js";

            // 夹具必须先于产品模块的副作用安装，否则桥与订阅会拿到未替换的运行时。
            const 夹具 = 创建夹具();
            // 本页只验证内容层：清空岛快照里的常驻实例，避免真实音乐/天气卡抢占锚点可见位与前台排序。
            // 快照形状仍是生产读取路径（get_island_snapshot）给出的同一份数据。
            const 原生 = window.__DESKTOP_TOOLS_NATIVE__;
            const 原invoke = 原生.invoke.bind(原生);
            let 功能图标场景 = false;
            let 插件锚点场景 = false;
            let 收集列表 = [];

            let 天气预报;
            let 已读取天气 = false;
            const 城市 = { id: "fixture-city", name: "测试城市", tz: "Asia/Shanghai" };
            let 清空实例 = true; // 内容层场景用空快照；音乐档位场景再切回夹具自带的真实音乐实例。
            原生.invoke = (命令, 载荷) => {
                if (命令 === "get_plugin_settings") return Promise.resolve(null);
                if (功能图标场景 && 命令 === "get_collect_items") return Promise.resolve(收集列表);
                if (功能图标场景 && 命令 === "list_weather_sources") return Promise.resolve([{ source: "qweather", cities: [城市] }]);
                if (功能图标场景 && 命令 === "subscribe_weather") return Promise.resolve(1);
                if (功能图标场景 && 命令 === "get_weather_forecast") { 已读取天气 = true; return Promise.resolve(天气预报); }
                if (命令 !== "get_island_snapshot") return 原invoke(命令, 载荷);
                return 原invoke(命令, 载荷).then((快照) => {
                    const instances = 清空实例 ? [] : [...快照.instances];
                    if (!功能图标场景 && !插件锚点场景) return { ...快照, instances };
                    const manifests = [...快照.runtime.manifests];
                    const registrations = [...快照.runtime.instances];
                    const 新卡片 = 功能图标场景 ? [["official.collect-box", "收集箱"], ["official.weather", "天气"]] : [];
                    if (插件锚点场景) 新卡片.push(["plugin.anchor-fixture", "插件锚点夹具"]);
                    for (const [id, name] of 新卡片) {
                        const identity = { instanceId: `island.${id}`, componentId: id };
                        manifests.push({ ...manifests[0], id, name });
                        registrations.push({ ...registrations[0], ...identity });
                        instances.push({ ...快照.instances[0], ...identity });
                    }
                    return { ...快照, runtime: { ...快照.runtime, manifests, instances: registrations }, instances };
                });
            };

            const [岛模块, 内容模块, React模块, 根模块, 偏好模块, 样式模块] = await Promise.all([
                import("./island.tsx"),
                import("./islandContent.ts"),
                import("react"),
                import("react-dom/client"),
                import("../../app/preferences/PreferencesProvider.tsx"),
                import("../../styles/global.css"),
            ]);
            void 样式模块; // 只要求样式表加载完成，不读导出。
            const { IslandPage } = 岛模块;
            const { ISLAND_STATUS_SPECS, islandAnchorGlyph, islandAnchorValue } = 内容模块;
            const React = React模块.default;
            const { createRoot } = 根模块;
            const { PreferencesProvider } = 偏好模块;

            // 独立岛页面标记与主题，与窗口入口保持一致。
            document.documentElement.dataset.island = "true";
            document.documentElement.dataset.theme = "dark";
            document.documentElement.dataset.desktopTheme = "dark";
            const 容器 = document.getElementById("fixture");
            let 根 = createRoot(容器);
            const 渲染 = (属性 = {}) => 根.render(React.createElement(PreferencesProvider, null, React.createElement(IslandPage, 属性)));
            // 音乐实例场景结束后重建岛页：用空快照重新挂载，后续内容层时序不受常驻锚点影响。
            const 重新挂载 = () => {
                根.unmount();
                根 = createRoot(容器);
                渲染();
            };

            const 结果 = document.getElementById("result");
            const 失败 = [];
            // 失败先写出的结论不被迟到的成功覆盖。
            const report = (text) => {
                if (!结果.textContent.startsWith("FAIL")) 结果.textContent = text;
                document.body.dataset.phase = 结果.textContent.startsWith("FAIL") ? "fail" : "pass";
            };
            const 断言 = (条件, 说明) => {
                if (!条件) 失败.push(说明);
            };
            const 近似 = (实际, 期望, 容差 = 1) => Math.abs(实际 - 期望) <= 容差;

            const 岛 = () => document.querySelector("main.island");
            const 当前态 = () => 岛()?.dataset.state;
            const 卡片 = () => document.querySelector(".island-card--anchors") ?? document.querySelector(".island-card");
            const 胶囊行 = () => document.querySelector('.island-anchor-row[data-layout="capsule"]');
            const 悬停行 = () => document.querySelector('.island-anchor-row[data-layout="hover"]');
            const 锚点 = (身份) => document.querySelector(`.island-anchor[data-anchor="${CSS.escape(身份)}"]`);
            const 墨 = (身份) => 锚点(身份)?.querySelector(".island-anchor__ink");
            const 条目 = (身份) => 锚点(身份)?.closest(".island-anchor-item");
            const 文案 = (身份) => 条目(身份)?.querySelector(".island-anchor__text");
            const 标签 = (身份) => 条目(身份)?.querySelector(".island-anchor-label");
            const 胶囊锚点 = () => [...(胶囊行()?.querySelectorAll(".island-anchor") ?? [])];
            const 悬停按钮 = () => [...(悬停行()?.querySelectorAll("button.island-anchor") ?? [])];
            const 播报 = () => document.querySelector(".island__announcer")?.textContent ?? "";
            const 详情 = () => document.querySelector(".island-anchor-detail");
            const 详情文本 = () => [...(详情()?.querySelectorAll(".island-anchor__text") ?? [])].map((节点) => 节点.textContent).join(" / ");
            const 行 = () => document.querySelector(".island-music__line");
            const 按键 = (键) => 岛().dispatchEvent(new KeyboardEvent("keydown", { key: 键, bubbles: true }));
            const 悬停 = () => 岛().dispatchEvent(new PointerEvent("pointerover", { bubbles: true, pointerType: "mouse", relatedTarget: null }));

            // 等切态完成并恢复自然布局后再测量；动画期间根节点带内联尺寸。
            const 稳定 = async (期望) => {
                await 直到(() => 当前态() === 期望, `切到 ${期望}`, 5000);
                await 直到(() => !岛().style.inlineSize && !岛().style.blockSize, `${期望} 恢复自然布局`, 5000);
                await 等待(40);
            };

            // 合成 PointerEvent 没有 OS 活动指针；只替换 capture 平台方法，命中、拖动意图与展开判定仍走生产处理器。
            const 单击元素 = async (节点) => {
                const 框 = 节点.getBoundingClientRect();
                const 原set = 岛().setPointerCapture;
                const 原has = 岛().hasPointerCapture;
                const 原release = 岛().releasePointerCapture;
                岛().setPointerCapture = () => {};
                岛().hasPointerCapture = () => false;
                岛().releasePointerCapture = () => {};
                try {
                    const 点 = { clientX: 框.x + 框.width / 2, clientY: 框.y + 框.height / 2, screenX: 11, screenY: 11 };
                    节点.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, pointerType: "mouse", pointerId: 7, button: 0, buttons: 1, ...点 }));
                    岛().dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerType: "mouse", pointerId: 7, button: 0, ...点 }));
                } finally {
                    岛().setPointerCapture = 原set;
                    岛().hasPointerCapture = 原has;
                    岛().releasePointerCapture = 原release;
                }
            };
            const 单击卡片 = () => 单击元素(document.querySelector(".island-card"));

            // 浮岛令牌由页面探针复制到岛根；用隐藏探针取当前主题下的计算色，避免把十六进制与 rgb 直接比较。
            const 令牌色 = (名) => {
                const 探针 = document.createElement("span");
                探针.style.color = `var(${名})`;
                探针.style.display = "none";
                岛().appendChild(探针);
                const 值 = getComputedStyle(探针).color;
                探针.remove();
                return 值;
            };

            // Web Animations 关键帧按属性名取值，兼容 camelCase 与连字符两种序列化。
            const 帧值 = (帧, 属性) => {
                const 目标 = 属性.replace(/-/g, "").toLowerCase();
                for (const [键, 值] of Object.entries(帧 ?? {})) {
                    if (键.replace(/-/g, "").toLowerCase() === 目标) return 值;
                }
                return undefined;
            };
            const 动画摘要 = (节点) =>
                (节点?.getAnimations?.({ subtree: true }) ?? []).map((动画) => {
                    const 时间 = 动画.effect.getTiming();
                    const 帧 = 动画.effect.getKeyframes();
                    return { 时长: 时间.duration, 延迟: 时间.delay ?? 0, 缓动: 时间.easing, 首帧: 帧[0], 末帧: 帧[帧.length - 1] };
                });

            const 事实 = (来源, 状态, 主信息, 附加, 层 = "event") => ({
                source: 来源,
                layer: 层,
                nowMs: Date.now(),
                unit: { status: 状态, primary: 主信息, secondary: 附加 },
            });
            const 主信息 = "任务正文";
            const 长中文 = "一二三四五六七八九十一二三四五六七八九十"; // 20 个汉字，触发 18 字截断。
            const 长英文 = "abcdefghijklmnopqrstuvwxyzabcdefghijklmn"; // 40 个字符，触发 36 字符截断。

            let 阶段 = "启动"; // 失败结论带上阶段，便于定位断言。
            const 运行 = async () => {
                await 直到(() => 岛(), "岛根节点挂载");
                await 直到(() => 夹具.提交.length > 0, "岛完成首次原生几何提交", 8000);
                await 稳定("collapsed");

                // ---- 一、零锚点空态与胶囊只读语义 ----

                阶段 = "一、零锚点空态与胶囊只读语义";
                const 时钟 = 锚点("clock");
                断言(Boolean(时钟), "零锚点必须显示空态圆锚点");
                const 时钟文本节点 = 时钟?.parentElement?.querySelector(".island-anchor__clock") ?? null;
                const 时钟文本 = 时钟文本节点?.textContent ?? "";
                断言(/^\d{2}:\d{2}$/.test(时钟文本), `空态时钟应显示在圆锚点右侧，实际 ${时钟文本}`);
                断言(时钟文本节点 !== null && Number.parseFloat(getComputedStyle(时钟文本节点).fontSize) >= 13, `空态时钟字号应不小于 13px，实际 ${时钟文本节点 ? getComputedStyle(时钟文本节点).fontSize : "无节点"}`);
                const [时, 分] = 时钟文本.split(":").map(Number);
                const 当前时间 = new Date();
                断言(Math.abs(时 * 60 + 分 - (当前时间.getHours() * 60 + 当前时间.getMinutes())) <= 1, `空态时钟应与当前时间一致，实际 ${时钟文本}`);
                断言(胶囊锚点().length === 1, `零锚点只应有一个空态圆，实际 ${胶囊锚点().length}`);
                断言(胶囊行().querySelectorAll("button").length === 0, "胶囊必须是只读的，不得出现按钮");
                断言(岛().tabIndex === -1, `胶囊不得进入 Tab 顺序，实际 tabIndex=${岛().tabIndex}`);
                断言([...胶囊行().querySelectorAll("*")].every((节点) => 节点.tabIndex < 0), "胶囊内不得有可聚焦元素");
                断言(胶囊锚点().every((节点) => 节点.tagName === "SPAN" && !节点.hasAttribute("role")), "胶囊锚点必须是只读 span，不得成为按钮或可聚焦控件");
                await 单击卡片();
                await 稳定("expanded");
                断言(Boolean(卡片()), "零锚点空态仍必须可单击展开");
                按键("Escape");
                await 稳定("collapsed");

                // ---- 二、十种基础状态逐条：视觉差异、固定短词与结束后去向 ----

                阶段 = "二、十种基础状态逐条：视觉差异、固定短词与结束后去向";
                // 取消/完成的去向是「直接消失」「收成圆点」，其符号与短词由真实模型给出并在本页断言；
                // 取消态按规格不渲染 DOM，因此同时断言它没有留下锚点或播报。
                const 状态用例 = [
                    { 状态: "pending", 词: "待开始", 形: "ring", 符号: "", 去向: "linger", 强调: "--fence-text" },
                    { 状态: "running", 词: "进行中", 形: "ring", 符号: "", 去向: "linger", 强调: "--fence-active", 附加: "40%" },
                    { 状态: "paused", 词: "暂停", 形: "glyph", 符号: "pause", 去向: "linger", 强调: "--fence-text" },
                    { 状态: "completed", 词: "完成", 形: "glyph", 符号: "check", 去向: "dot", 强调: "--fence-text" },
                    { 状态: "failed", 词: "失败", 形: "glyph", 符号: "alert", 去向: "linger", 强调: "--fence-error" },
                    { 状态: "cancelled", 词: "取消", 形: "glyph", 符号: "cross", 去向: "vanish", 强调: "--fence-text" },
                    { 状态: "awaiting", 词: "待确认", 形: "glyph", 符号: "question", 去向: "linger", 强调: "--fence-warning" },
                    { 状态: "disconnected", 词: "未连接", 形: "glyph", 符号: "link-off", 去向: "linger", 强调: "--fence-text" },
                    { 状态: "unauthorized", 词: "未授权", 形: "glyph", 符号: "lock", 去向: "linger", 强调: "--fence-text" },
                    { 状态: "indeterminate", 词: "运行中", 形: "sweep", 符号: "", 去向: "linger", 强调: "--fence-active" },
                ];
                for (const 用例 of 状态用例) {
                    const 来源 = `状态-${用例.状态}`;
                    const 身份 = `event:${来源}`;
                    const 规格 = ISLAND_STATUS_SPECS[用例.状态];
                    const 模型字形 = islandAnchorGlyph(用例.状态, 0.4);
                    断言(规格?.word === 用例.词, `${用例.状态} 的固定短词应为 ${用例.词}，实际 ${规格?.word}`);
                    断言(规格?.disposition === 用例.去向, `${用例.状态} 的结束去向应为 ${用例.去向}，实际 ${规格?.disposition}`);
                    断言(模型字形.kind === 用例.形, `${用例.状态} 的视觉种类应为 ${用例.形}，实际 ${模型字形.kind}`);
                    if (用例.形 === "glyph") 断言(模型字形.symbol === 用例.符号, `${用例.状态} 的符号应为 ${用例.符号}，实际 ${模型字形.symbol}`);
                    if (用例.状态 === "running") 断言(模型字形.arc === 0.4, `进行中弧长应随 40% 进度，实际 ${模型字形.arc}`);
                    if (用例.状态 === "pending") 断言(模型字形.arc === 0, "待开始必须是空环");

                    渲染({ contentFacts: [事实(来源, 用例.状态, 主信息, 用例.附加)] });
                    if (用例.去向 === "vanish") {
                        await 直到(() => 播报() === "" && Boolean(锚点("clock")), `${用例.状态} 直接消失并回落空态`, 4000);
                        断言(!锚点(身份), "取消状态必须直接消失，不保留锚点");
                        断言(!播报().includes(用例.词), "取消状态不得进入播报");
                        continue;
                    }
                    await 直到(() => 墨(身份), `${用例.状态} 锚点渲染`);
                    const 墨节点 = 墨(身份);
                    断言(墨节点.dataset.status === 用例.状态, `${用例.状态} 锚点 data-status 应为自身，实际 ${墨节点.dataset.status}`);
                    断言(墨节点.dataset.glyph === 用例.形, `${用例.状态} 锚点 data-glyph 应为 ${用例.形}，实际 ${墨节点.dataset.glyph}`);
                    断言((墨节点.dataset.symbol ?? "") === 用例.符号, `${用例.状态} 锚点 data-symbol 应为 ${用例.符号}，实际 ${墨节点.dataset.symbol}`);
                    if (用例.形 === "ring") {
                        断言(Boolean(墨节点.querySelector(".island-anchor__track")), `${用例.状态} 必须绘制轨道`);
                        const 实线弧 = [...墨节点.querySelectorAll("svg path")];
                        if (用例.状态 === "pending") 断言(实线弧.length === 0, "待开始为空环，不得绘制已播弧");
                        else 断言(实线弧.length === 1 && /A8\.5/.test(实线弧[0].getAttribute("d") ?? ""), "进行中必须用 SVG path 实线弧表示进度");
                        断言(!墨节点.innerHTML.includes("stroke-dasharray"), `${用例.状态} 进度环不得用 stroke-dasharray 模拟`);
                    } else if (用例.形 === "sweep") {
                        const 扫 = 墨节点.querySelector(".island-anchor__sweep");
                        断言(Boolean(扫), "无总量运行中必须绘制不定弧");
                        断言(扫.dataset.motion === "true", `不定弧应带 data-motion=true，实际 ${扫.dataset.motion}`);
                        断言(/^M10 1\.5 A8\.5/.test(扫.getAttribute("d") ?? ""), "不定弧必须是 SVG 实线弧");
                        断言(!墨节点.innerHTML.includes("stroke-dasharray"), "不定弧不得用 stroke-dasharray 模拟");
                    } else if (["pause", "check", "alert", "cross"].includes(用例.符号)) {
                        断言(Boolean(墨节点.querySelector(".island-anchor__icon svg")), `${用例.状态} 必须使用内置图标绘制符号`);
                    } else {
                        断言(Boolean(墨节点.querySelector("svg path")?.getAttribute("d")), `${用例.状态} 必须用路径绘制符号`);
                        断言(!墨节点.querySelector(".island-anchor__icon"), `${用例.状态} 不应复用其他状态的图标`);
                    }
                    const 颜色 = getComputedStyle(墨节点).color;
                    断言(颜色 === 令牌色(用例.强调), `${用例.状态} 锚点颜色应为 ${用例.强调}，实际 ${颜色}`);
                    断言(播报().includes(`${来源} · ${用例.词}`), `${用例.状态} 播报必须包含来源与短词，实际 ${播报()}`);
                    if (用例.状态 === "running") 断言(播报().includes(" · 25%"), `进行中播报应带 25% 里程碑，实际 ${播报()}`);
                    else 断言(播报().includes(主信息), `${用例.状态} 播报必须带关键值（主信息），实际 ${播报()}`);
                    if (用例.去向 === "dot") {
                        断言(!文案(身份), "完成状态必须收成圆点，不得保留内容行");

                断言(夹具.提交.length - 再进入前 === 1 && JSON.stringify(夹具.提交.at(-1).windowBox) === 全高盒, "再入态重新且只提交一次工作区全高盒");
                按键("Escape");
                await 稳定("collapsed");
                悬停();
                await 稳定("hover");

                阶段 = "插件自绘 hover 生命周期";
                const { PluginSlot } = await import('../components/PluginSlot.tsx');
                const { bindPluginApi, pluginModules, loadPluginScript } = await import('../../bridge/pluginScripts.ts');
                const 原模块加载 = pluginModules.load;
                pluginModules.load = async () => ({ default: {} });
                const 插件容器 = document.createElement('div');
                容器.append(插件容器);
                const 插件根 = createRoot(插件容器);
                let 绘制次数 = 0;
                let 清理次数 = 0;
                const 插件清单 = { id: 'plugin.hover-fixture', name: '自绘插件', script: '' };
                bindPluginApi(插件清单.id, { renderIslandHover: (容器, 上下文) => {
                    绘制次数++;
                    const 自绘 = document.createElement('article');
                    自绘.dataset.customHover = 上下文.instanceId;
                    自绘.textContent = '插件决定自己的 DOM';
                    容器.append(自绘);
                    return () => { 清理次数++; 自绘.remove(); };
                } });
                const 绘制插件 = (instanceId) => 插件根.render(React.createElement(PluginSlot, { manifest: 插件清单, instanceId, collapsed: false, hover: true }));
                await loadPluginScript(插件清单.id, 'fixture/hover.js');
                绘制插件('island.plugin.hover-fixture');
                await 直到(() => 插件容器.querySelector('article[data-custom-hover]'), '插件自定义 DOM 挂载');
                断言(绘制次数 === 1 && 清理次数 === 0, '首轮自绘只挂载一次');
                绘制插件('island.plugin.hover-next');
                await 直到(() => 插件容器.querySelector('[data-custom-hover="island.plugin.hover-next"]'), '切换插件实例');
                断言(绘制次数 === 2 && 清理次数 === 1, '切换先清理上一轮');
                插件根.unmount();
                断言(清理次数 === 2, '卸载调用最后一轮清理');
                const 失败根 = createRoot(插件容器);
                const 失败清单 = { id: 'plugin.hover-failed', name: '失败插件', script: '' };
                bindPluginApi(失败清单.id, { renderIslandHover: () => { throw new Error('预期的插件渲染异常'); } });
                await loadPluginScript(失败清单.id, 'fixture/failed.js');
                pluginModules.load = 原模块加载;
                失败根.render(React.createElement(PluginSlot, { manifest: 失败清单, instanceId: 'island.plugin.hover-failed', collapsed: false, hover: true }));
                await 直到(() => 插件容器.textContent.includes('组件渲染失败'), '插件异常收口到既有失败态');
                断言(岛().isConnected, '插件异常不打断浮岛');
                失败根.unmount();
                插件容器.remove();

                阶段 = "逐功能显示开关与 hover 方向键回落";
                功能图标场景 = false;
                插件锚点场景 = true;
                const 音乐锚点 = "event:音乐控制";
                const 插件锚点 = "resident:插件锚点夹具";
                const 样例通知 = 消息(900, "error", "真实通道的失败通知", "真实来源");
                const 功能 = [["music", 音乐锚点], ["message", 通知锚点], ["plugin", 插件锚点]];
                夹具.pushPreferences({ islandAnchorVisible: {} });
                夹具.pushMessages([]);
                重新挂载();
                await 直到(() => 锚点(插件锚点), "真实快照挂载插件");
                夹具.pushMusic(媒体("后台继续播放", "测试艺人"));
                await 直到(() => 锚点(音乐锚点), "播放会话占有音乐锚点");
                悬停();
                await 稳定("hover");
                锚点(音乐锚点).click();
                await 直到(() => 锚点(音乐锚点).getAttribute("aria-pressed") === "true", "上一轮 hover 选中音乐");
                按键("Escape");
                await 稳定("collapsed");
                夹具.pushMessages([样例通知]);
                await 直到(() => 胶囊锚点().length === 3 && 文案(通知锚点)?.textContent.includes(样例通知.content), "新消息接管胶囊正文且音乐仍在");
                悬停();
                await 稳定("hover");
                断言(悬停按钮()[0] !== 锚点(通知锚点) && 锚点(通知锚点).getAttribute("aria-pressed") === "true" && 通知行().length === 1,
                    "再次进入 hover 要选中胶囊正在显示的消息，而不是第一枚或上一轮选中的音乐");

                阶段 = "hover 功能图标安全区";
                const 事件锚点 = "event:图标测试";
                渲染({ contentFacts: [事实("图标测试", "pending", "普通事件")] });
                await 直到(() => 锚点(事件锚点) && 近似(图标盒(锚点(通知锚点)).getBoundingClientRect().width, 16, 0.02), "普通事件进入 hover 行，初选铃铛完成缩放");
                for (const 身份 of [音乐锚点, 通知锚点, 插件锚点, 事件锚点]) {
                    const 按钮 = 锚点(身份);
                    const 图标 = 按钮.querySelector(".island-anchor__icon");
                    const 图形 = 图标.querySelector("svg");
                    const 图框 = 图形.getBoundingClientRect();
                    const 安全区 = 图标.getBoundingClientRect();
                    const 圆框 = 按钮.getBoundingClientRect();
                    const 像素 = 图形.getBBox();
                    const 视口 = 图形.viewBox.baseVal;
                    const 边长 = 按钮.getAttribute("aria-pressed") === "true" ? 16 : 20;
                    const 内缩 = (28 - 边长) / 2;
                    断言(近似(图框.width, 边长, 0.1) && 近似(图框.height, 边长, 0.1) && 近似(图框.left, 安全区.left, 0.1) && 近似(图框.top, 安全区.top, 0.1), `${身份} 的 SVG 等比落在安全区，绘制 ${边长}×${边长}，实际 ${图框.width}×${图框.height}`);
                    断言(getComputedStyle(图标).overflow === "visible" && 像素.width > 0 && 像素.height > 0 && 像素.x >= 视口.x && 像素.y >= 视口.y && 像素.x + 像素.width <= 视口.x + 视口.width && 像素.y + 像素.height <= 视口.y + 视口.height, `${身份} 的图形不能被图标圆角蒙版或 SVG 视口截断`);
                    断言(近似(圆框.width, 28, 0.1) && 近似(圆框.height, 28, 0.1) && 近似(安全区.left - 圆框.left, 内缩, 0.1) && 近似(安全区.top - 圆框.top, 内缩, 0.1), `${身份} 按钮不随选中缩放改变，只增加缩小图形的留白`);
                }
                渲染();
                按键("Escape");
                await 稳定("collapsed");
                await 直到(() => !锚点(事件锚点), "清理仅用于测试的普通事件");
                for (const [类型, 身份] of 功能) {
                    夹具.pushPreferences({ islandAnchorVisible: { [类型]: false } });
                    await 直到(() => !锚点(身份), `${类型} 胶囊撤下`);
                    断言(功能.filter(([, 值]) => 值 !== 身份).every(([, 值]) => 锚点(值)), `${类型} 不连动另外两种胶囊锚点`);
                    悬停();
                    await 稳定("hover");
                    断言(!锚点(身份) && 悬停按钮().length === 2, `${类型} 同步从 hover 撤下`);
                    按键("Escape");
                    await 稳定("collapsed");
                    夹具.pushPreferences({ islandAnchorVisible: {} });
                    await 直到(() => Boolean(锚点(身份)), `${类型} 重新启用后原事实可见`);
                }
                悬停();
                await 稳定("hover");
                锚点(通知锚点).click();
                锚点(通知锚点).focus();
                await 直到(() => 通知行().length === 1, "撤下前选中通知详情");
                const 待回落 = 悬停按钮().filter((节点) => 节点.dataset.anchor !== 通知锚点);
                夹具.pushPreferences({ islandAnchorVisible: { message: false } });
                await 直到(() => !锚点(通知锚点) && !通知行().length && !播报().includes(样例通知.content), "撤下当前项后详情、计数与播报都更新");
                const 回落 = 悬停按钮().find((节点) => 节点.getAttribute("aria-pressed") === "true");
                断言(回落 === 待回落[0] && document.activeElement === 回落, `当前项撤下后选中并聚焦首个可用锚点，实际 ${回落?.dataset.anchor} / ${document.activeElement?.dataset.anchor ?? document.activeElement?.tagName}`);
                回落?.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
                await 直到(() => 待回落[1]?.getAttribute("aria-pressed") === "true", "方向键在仍可见的两项间移动");
                夹具.pushPreferences({ islandAnchorVisible: { message: false, music: false, plugin: false } });
                await 直到(() => !悬停按钮().length && 锚点("clock"), "全部撤下时回落时钟");
                按键("Enter");
                await 稳定("expanded");
                for (const 名称 of ["消息", "音乐控制", "插件锚点夹具"]) 断言(岛().querySelector(`.island-card[aria-label="${名称}"]`), `${名称}的展开卡不受显示开关影响`);

                阶段 = "旧演示参数不注册定时器，真实消息仍到达";
                const 页面地址 = location.href;
                const 原注册 = window.setInterval;
                const 周期 = [];
                window.setInterval = (回调, 毫秒, ...参数) => {
                    周期.push(毫秒);
                    return 原注册.call(window, 回调, 毫秒, ...参数);
                };
                try {
                    const 旧地址 = new URL(页面地址);
                    旧地址.searchParams.set("demo", "1");
                    history.replaceState(null, "", 旧地址);
                    夹具.pushPreferences({ islandAnchorVisible: {} });
                    夹具.pushMessages([样例通知]);
                    重新挂载();
                    await 直到(() => 计数文本() === "1" && 锚点(插件锚点), "旧参数下仍挂载真实通知与插件锚点");
                    夹具.pushMusic(媒体("后台继续播放", "测试艺人"));
                    await 直到(() => 锚点(音乐锚点), "真实媒体仍可接入");
                    const 后到 = 消息(901, "info", "后来收到的真实消息", "真实新来源");
                    夹具.pushMessages([样例通知, 后到]);
                    await 直到(() => 计数文本() === "2" && 播报().includes(后到.content), "只合并真正到达的通知");
                    断言(!周期.includes(6000), `旧演示参数不得注册 6s 轮转定时器，实际周期 ${周期.join(",")}`);
                } finally {
                    根.unmount();
                    window.setInterval = 原注册;
                    history.replaceState(null, "", 页面地址);
                }
                report(失败.length ? `FAIL\n- ${失败.join("\n- ")}` : `PASS 浮岛内容层：三卡折叠/展开 ${内部提交数} 次窗口提交；几何、键盘、通知开关；无演示轮转`);
            };

            渲染();
            运行().catch((错误) => {
                report(`FAIL\n- ${阶段}：${错误 instanceof Error ? 错误.message : String(错误)}${失败.length ? `\n- ${失败.join("\n- ")}` : ""}`);
            });
        </script>
    </body>
</html>
