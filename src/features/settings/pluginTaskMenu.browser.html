<!doctype html>
<html lang="zh-CN">
    <meta charset="utf-8" />
    <title>插件任务菜单</title>
    <body>
        <main id="root"></main>
        <script type="module">
            const React = await import("react");
            const { createRoot } = await import("react-dom/client");
            const { mockIPC, mockWindows } = await import("@tauri-apps/api/mocks");
            const { PluginTaskMenu } = await import("./PluginTaskMenu.tsx");
            await import("../../styles/global.css");

            mockWindows("main");
            mockIPC(() => undefined, { shouldMockEvents: true });

            const samples = [
                { title: "空态", tasks: [] },
                { title: "排队中", tasks: [{ id: "queued", name: "甲", status: "queued", stage: "queued", percent: 0 }] },
                { title: "解压中", tasks: [{ id: "extract", name: "乙", status: "running", stage: "extract", percent: 42 }] },
                { title: "复制中", tasks: [{ id: "copy", name: "丙", status: "running", stage: "copy", percent: 70 }] },
                { title: "成功", tasks: [{ id: "done", name: "丁", status: "done", stage: "done", percent: 100 }] },
                { title: "失败", tasks: [{ id: "failed", name: "戊", status: "failed", stage: "failed", percent: 10, detail: "安装失败：清单无效" }] },
                { title: "已取消", tasks: [{ id: "cancelled", name: "己", status: "cancelled", stage: "cancelled", percent: 0 }] },
            ];

            createRoot(document.getElementById("root")).render(
                React.createElement(
                    "div",
                    { className: "plugin-task-menu-board" },
                    samples.map((sample) =>
                        React.createElement(
                            "section",
                            { key: sample.title },
                            React.createElement("h2", null, sample.title),
                            React.createElement(
                                "div",
                                { className: "plugin-task-menu-slot" },
                                React.createElement(PluginTaskMenu, {
                                    tasks: sample.tasks,
                                    open: true,
                                    onCancel() {},
                                    onCollapse() {},
                                }),
                            ),
                        ),
                    ),
                ),
            );
        </script>
        <style>
            .plugin-task-menu-board {
                display: grid;
                gap: 24px;
                max-width: 420px;
                margin: 24px auto;
            }
            .plugin-task-menu-board section {
                display: grid;
                gap: 8px;
                padding: 16px;
                border: 1px solid var(--color-border);
                border-radius: var(--surface-radius);
            }
            .plugin-task-menu-board h2 {
                margin: 0;
                font-size: 14px;
                font-weight: 600;
            }
            .plugin-task-menu-slot {
                position: relative;
            }
        </style>
    </body>
</html>
